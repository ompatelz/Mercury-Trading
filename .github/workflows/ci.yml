name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python Quality and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy app
      - name: Build native extension for full test suite
        run: python scripts/build_native.py
      - name: Native extension import
        run: python -c "import app.backtesting.native._engine"
      - name: Unit and integration tests
        run: pytest
      - name: Canonical PAPER-only mission
        run: pytest tests/integration/test_end_to_end_mission.py
      - name: Deterministic paper trading replay
        run: pytest tests/unit/test_paper_trading.py tests/integration/test_api.py
      - name: Deterministic execution-model contracts
        run: pytest tests/unit/test_paper_trading.py -k "quote_execution or microstructure or larger_participation or latency"

  frontend:
    name: Research Dashboard Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Lint
        run: pnpm --dir frontend lint
      - name: Type check
        run: pnpm --dir frontend typecheck
      - name: Unit tests
        run: pnpm --dir frontend test
      - name: Build
        run: pnpm --dir frontend build
      - name: Install Playwright browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --dir frontend e2e

  database:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mercury_test
          POSTGRES_USER: mercury
          POSTGRES_PASSWORD: mercury
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercury -d mercury_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mercury:mercury@localhost:5432/mercury_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Alembic heads
        run: alembic heads
      - name: Run migrations from clean DB
        run: alembic upgrade head

  campaign-worker:
    name: Campaign Worker Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mercury_test
          POSTGRES_USER: mercury
          POSTGRES_PASSWORD: mercury
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercury -d mercury_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mercury:mercury@localhost:5432/mercury_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        run: alembic upgrade head
      - name: Worker tests
        run: pytest tests/unit/test_campaigns.py tests/integration/test_api.py

  regime-evolution:
    name: Regime and Evolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Regime and evolution tests
        run: pytest tests/unit/test_regimes.py tests/unit/test_evolution.py

  native-engine:
    name: C++ Native Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: CMake configure
        run: cmake -S . -B build/native -DCMAKE_CXX_FLAGS="-Wall -Wextra" -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: C++ pybind11 build
        run: cmake --build build/native --config Release
      - name: Native execution tests
        run: ctest --test-dir build/native --output-on-failure
      - name: Native extension import
        run: python -c "import app.backtesting.native._engine"
      - name: Python native parity tests
        run: pytest tests/unit/test_native_backtesting.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build .
      - name: Validate Compose worker topology
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
        run: docker compose config --quiet
      - name: Compose API readiness smoke test
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose up --build -d db api
          trap 'docker compose down --volumes' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        run: git diff --check
      - name: Reject committed env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Do not commit .env files"
            exit 1
          fi
      - name: Scan for private keys and common API-token formats
        run: |
          if git grep -n -I -E '-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}'; then
            echo "Potential credential material detected"
            exit 1
          fi

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tooling and project dependencies
        run: pip install pip-audit && pip install -e ".[dev]"
      - name: Audit installed Python dependencies
        run: pip-audit
