name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python Quality and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy app
      - name: Build native extension for full test suite
        run: python scripts/build_native.py
      - name: Native extension import
        run: python -c "import app.backtesting.native._engine"
      - name: Unit and integration tests
        run: pytest

  database:
    name: PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mercury_test
          POSTGRES_USER: mercury
          POSTGRES_PASSWORD: mercury
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercury -d mercury_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mercury:mercury@localhost:5432/mercury_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Alembic heads
        run: alembic heads
      - name: Run migrations from clean DB
        run: alembic upgrade head

  native-engine:
    name: C++ Native Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: CMake configure
        run: cmake -S . -B build/native -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: C++ pybind11 build
        run: cmake --build build/native --config Release
      - name: Native extension import
        run: python -c "import app.backtesting.native._engine"
      - name: Python native parity tests
        run: pytest tests/unit/test_native_backtesting.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build .

  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        run: git diff --check
      - name: Reject committed env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Do not commit .env files"
            exit 1
          fi
