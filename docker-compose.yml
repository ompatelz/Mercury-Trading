services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mercury
      POSTGRES_USER: ${POSTGRES_USER:-mercury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercury -d mercury"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mercury}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mercury
      YAHOO_AUTO_ADJUST: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: sh -c "alembic upgrade head && python scripts/run_worker.py --worker-name docker-worker"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mercury}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mercury
      YAHOO_AUTO_ADJUST: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:

